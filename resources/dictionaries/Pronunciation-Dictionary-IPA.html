<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pronunciation + IPA</title>
  
  <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');
</style>

  
  <style>
    body {
      font-family: "Noto Serif", serif;
      padding: 20px;
    }
    input {
      padding: 8px;
      font-size: 20px;
    }
    button {
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
      margin-left: 5px;
    }
    #ipa {
      margin-top: 15px;
      font-size: 25px;
      font-weight: bold;
    }
  </style>
</head>
<body bgcolor="#FFFCF0">

<center>
  <img src="logo.png" width="150px" style="margin-bottom: 0px; margin-top: 0px;"></img>
  <p style="font-size: 28px; font-weight: bold; line-height: 5px;">English Pronunciation Dictionary</p>
  <p style="font-size: 12px; font-weight: bold; color: #2f5f9a; line-height: 0px;">Created by: Teacher Christian Serrano</p>
</br>
  <input type="text" id="wordInput" placeholder="Type a word" style="font-family: 'Noto Serif', serif; font-weight: bold; color: #2f5f9a;">
  <button onclick="playPronunciation()" style="font-family: 'Noto Serif', serif; font-weight: bold;">🔊 Listen</button>
  <button onclick="getIPA()" style="font-family: 'Noto Serif', serif; font-weight: bold;">🔤 IPA</button>

  <audio id="audioPlayer"></audio>

  <div id="ipa" style="color: #bf2024;"></div>
  <p style="font-size: 10px; font-weight: bold;">(The apostrophe in the phonetic word means that the stress is that syllable in British English)</p>
  <p style="font-size: 10px; font-weight: bold; color: #bf2024; line-height: 0px;">IPA = International Phonetic Alphabet</p>
 </center>

  <script>
    function playPronunciation() {
      const word = document.getElementById("wordInput").value.trim().toLowerCase();
      if (!word) return alert("Please enter a word");

      const audio = document.getElementById("audioPlayer");
      audio.src = `https://d1qx7pbj0dvboc.cloudfront.net/${word}.mp3`;
      audio.play().catch(() => {
        alert("Audio not found");
      });
    }

    async function getIPA() {
      const word = document.getElementById("wordInput").value.trim().toLowerCase();
      if (!word) return alert("Please enter a word");

      const ipaDiv = document.getElementById("ipa");
      ipaDiv.textContent = "Loading IPA...";

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const data = await response.json();

        const phonetics = data[0].phonetics;
        const ipa = phonetics.find(p => p.text)?.text || "IPA not available";

        ipaDiv.textContent = `/${ipa}/`;
      } catch (error) {
        ipaDiv.textContent = "Word not found";
      }
    }
  </script>

</body>
</html>
